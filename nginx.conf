# Cấu hình Nginx mẫu cho hệ thống điểm danh
# Lưu ý: Cập nhật đường dẫn tuyệt đối ở directive 'root' cho phù hợp với hệ thống của bạn.

server {
    listen 80;
    server_name localhost;

    # Gói build tĩnh của frontend (sau khi chạy npm run build)
    root /path/to/project/frontend/dist;
    index index.html;

    # 1. Phục vụ Web App Frontend (Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Phục vụ Thư viện và Mô hình MediaPipe cục bộ (Self-hosted)
    # Tích hợp bộ đệm (Caching) tối đa để trình duyệt không phải tải lại ở các lần sau.
    location /libs/mediapipe/ {
        alias /path/to/project/frontend/public/libs/mediapipe/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        types {
            application/javascript js;
            application/wasm wasm;
            application/octet-stream binarypb;
            application/octet-stream data;
        }
    }

    # 3. Phục vụ âm thanh tiếng Việt tĩnh
    location /audio/ {
        alias /path/to/project/frontend/public/audio/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 4. Proxy ngược (Reverse Proxy) tới FastAPI Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Tăng giới hạn thời gian timeout cho xử lý ảnh nhận diện của server nếu cần
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
