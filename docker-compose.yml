version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: attendance_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_verification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attendance_backend
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/attendance_verification
      INSIGHTFACE_ROOT: /app/models
      SIMILARITY_THRESHOLD: 0.7
      UPLOADS_DIR: /app/backend/data/face_images
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:8000", "http://127.0.0.1:8000"]'
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - backend_models:/app/models
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backend_models:
