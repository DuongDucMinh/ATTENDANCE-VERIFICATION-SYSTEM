version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: attendance_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_verification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
